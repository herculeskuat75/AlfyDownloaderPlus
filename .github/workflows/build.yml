name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Archive
      run: |
        mkdir -p extracted_project
        unzip -o AlfyDownloaderProject.zip -d extracted_project
        echo "=== ISI FOLDER EKSTRAK ==="
        find extracted_project -maxdepth 2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        # Cari lokasi file gradlew secara otomatis di semua subfolder
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: File gradlew tidak ditemukan sama sekali!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Proyek ditemukan di folder: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlfyDownloader-APK
        path: "**/outputs/apk/debug/app-debug.apk"
