name: Build AlfyDownloader+ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK ditemukan: $APK"
          cp "$APK" AlfyDownloader.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfyDownloader-APK
          path: AlfyDownloader.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AlfyDownloader v${{ github.run_number }}
          files: AlfyDownloader.apk
