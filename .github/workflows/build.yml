name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Archive
      run: |
        mkdir -p extracted_project
        unzip -o AlfyDownloaderProject.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper & Build APK
      run: |
        # Masuk ke folder inti proyek Android
        cd extracted_project/AlfyDownloader
        
        # Jika file gradlew belum ada, buat secara otomatis menggunakan gradle
        if [ ! -f "gradlew" ]; then
          echo "Membuat file gradlew otomatis..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlfyDownloader-APK
        path: "**/outputs/apk/debug/app-debug.apk"
