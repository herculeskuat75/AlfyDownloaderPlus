name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # to keep the same signature across builds (lets new APKs update old installs).
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret - release APK will be signed with the debug key."
          fi

      - name: Locate Gradle project
        run: |
          find_settings() { find . -maxdepth 5 -name settings.gradle.kts -not -path "*/.git/*" -not -path "./_unzipped/*" | head -n 1; }
          S=$(find_settings)
          if [ -z "$S" ]; then
            # Project was uploaded as a .zip file: extract it automatically
            Z=$(find . -maxdepth 2 -name "*.zip" -not -path "*/.git/*" | head -n 1)
            if [ -n "$Z" ]; then
              echo "Extracting $Z"
              mkdir -p _unzipped && unzip -q -o "$Z" -d _unzipped
              S=$(find _unzipped -maxdepth 5 -name settings.gradle.kts | head -n 1)
            fi
          fi
          if [ -z "$S" ]; then echo "settings.gradle.kts not found"; ls -la; exit 1; fi
          echo "Gradle project: $(dirname "$S")"
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Verify yt-dlp + FFmpegKit resolve (fail fast)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          grep -E "youtubedl-android|ffmpeg-kit" deps.txt | head -n 5
          grep -q "youtubedl-android" deps.txt
          grep -q "ffmpeg-kit" deps.txt

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="AlfyDownloader-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          [ -n "$SRC" ] || { echo "No release APK produced"; exit 1; }
          cp "$SRC" "$GITHUB_WORKSPACE/$NAME"
          SIZE=$(du -h "$GITHUB_WORKSPACE/$NAME" | cut -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME ($SIZE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package project source
        run: |
          zip -qr AlfyDownloader-source.zip "$PROJECT_DIR" -x "*/build/*" "*/.gradle/*" "*/.git/*"

      - name: Upload artifacts (APK + source ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: AlfyDownloader-build-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.name }}
            AlfyDownloader-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: AlfyDownloader+ ${{ steps.apk.outputs.tag }}
          body: |
            APK arm64-v8a • ${{ steps.apk.outputs.size }}
            yt-dlp universal extractor + FFmpegKit merge • Root / Non-root dual mode • VPN-safe
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
