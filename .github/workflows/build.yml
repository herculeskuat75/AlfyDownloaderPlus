name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # to keep the same signature across builds (lets new APKs update old installs).
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret - release APK will be signed with the debug key."
          fi

      - name: Locate Gradle project
        run: |
          S=$(find . -maxdepth 4 -name settings.gradle.kts -not -path "*/.git/*" | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found in repo"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Prepare APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="AlfyDownloader-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SRC" "$GITHUB_WORKSPACE/$NAME"
          SIZE=$(du -h "$GITHUB_WORKSPACE/$NAME" | cut -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME ($SIZE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: AlfyDownloader+ ${{ steps.apk.outputs.tag }}
          body: |
            APK arm64-v8a • ${{ steps.apk.outputs.size }}
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
