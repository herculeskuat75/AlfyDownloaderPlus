name: Build AlfyDownloader+ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan folder proyek (ekstrak ZIP otomatis bila perlu)
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Proyek sudah ada di root repo."
            echo "PROJ_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "ERROR: tidak ada settings.gradle.kts dan tidak ada file .zip di root repo."
              exit 1
            fi
            echo "Mengekstrak: $ZIP"
            rm -rf "$RUNNER_TEMP/proj" && mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            SET=$(find "$RUNNER_TEMP/proj" -maxdepth 3 -name settings.gradle.kts | head -n 1)
            if [ -z "$SET" ]; then
              echo "ERROR: settings.gradle.kts tidak ditemukan di dalam ZIP."
              exit 1
            fi
            echo "PROJ_DIR=$(dirname "$SET")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls "$PROJ_DIR"/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK ditemukan: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/AlfyDownloader.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfyDownloader-APK
          path: AlfyDownloader.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AlfyDownloader v${{ github.run_number }}
          files: AlfyDownloader.apk
